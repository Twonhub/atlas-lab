name: Publish Atlas Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate sources and download licensed 3D meshes
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check viewer.js
          node --check dissection.js
          node --check regions.js
          node --check anatomy_info.js
          node --test qa/regions.test.cjs qa/model_naming.test.cjs
          node --check model_naming.js
          python3 - <<'PYLESSONS'
          import json
          lessons=json.load(open('lessons.json'))
          assert len(lessons)>=6
          assert all(l.get('system') and len(l.get('targets',[]))>=3 for l in lessons)
          print('Validated',len(lessons),'3D guided lessons')
          PYLESSONS
          python3 -m json.tool asset_manifest.json >/dev/null
          python3 -m json.tool study_cards.json >/dev/null
          python3 - <<'PYCARDS'
          import json
          cards=json.load(open("study_cards.json"))
          assert len(cards)>=65
          assert all(all(c.get(k) for k in ("name","fact","function","description","relationships","study_tip","source")) for c in cards)
          print("Validated",len(cards),"expanded anatomy entries")
          PYCARDS
          python3 -m json.tool lessons.json >/dev/null
          mkdir -p _site/models
          base=https://raw.githubusercontent.com/nqwrc/3d-anatomy/master/public/models
          for layer in skeletal joints muscular cardiovascular lymphatic nervous visceral; do
            echo "Downloading verified geometry: ${layer}"
            curl -fL --retry 4 --retry-delay 3 "${base}/${layer}.glb" -o "_site/models/${layer}.glb"
            python3 - "${layer}" <<'PYVALID'
          import pathlib,struct,sys
          path=pathlib.Path("_site/models")/(sys.argv[1]+".glb")
          raw=path.read_bytes()
          assert len(raw)>4096 and raw[:4]==b"glTF", f"Invalid GLB: {path}"
          assert struct.unpack("<I",raw[4:8])[0]==2, f"Invalid GLB version: {path}"
          assert struct.unpack("<I",raw[8:12])[0]==len(raw), f"GLB truncated: {path}"
          print(path.name,len(raw),"bytes validated")
          PYVALID
          done
          python3 qa/check_model_labels.py
          curl -fL --retry 4 "${base}/License.txt" -o _site/models/License.txt
          curl -fL --retry 4 https://raw.githubusercontent.com/nqwrc/3d-anatomy/master/LICENSE -o _site/UPSTREAM_LICENSE.txt
          curl -fL --retry 4 https://raw.githubusercontent.com/nqwrc/3d-anatomy/master/NOTICE -o _site/UPSTREAM_NOTICE.txt
          cp index.html app.js viewer.js dissection.js regions.js model_naming.js anatomy_info.js styles.css study_cards.json lessons.json GET_STARTED.html ACCURACY_REVIEW.md DEPLOY_ONLINE.md MODEL_LICENSE_AND_ATTRIBUTION.md _site/
          python3 - <<'PYCACHE'
          import os,pathlib
          version=os.environ["GITHUB_SHA"][:12]
          for filename in ("index.html","app.js","viewer.js"):
              path=pathlib.Path("_site")/filename
              text=path.read_text()
              for asset in ("app.js","viewer.js","dissection.js","regions.js","anatomy_info.js","model_naming.js","styles.css"):
                  text=text.replace('"' + asset + '"','"' + asset + '?v=' + version + '"')
                  text=text.replace('"./' + asset + '"','"./' + asset + '?v=' + version + '"')
              path.write_text(text)
          print("Versioned browser assets with commit:",version)
          PYCACHE
          touch _site/.nojekyll
          python3 - <<'PYMANIFEST'
          import json,pathlib
          src=json.loads(pathlib.Path("asset_manifest.json").read_text())
          data={k:"models/"+v.rsplit("/",1)[-1] for k,v in src.items()}
          assert len(data)==7
          pathlib.Path("_site/asset_manifest.json").write_text(json.dumps(data,indent=2))
          print("Prepared model manifest:",list(data))
          PYMANIFEST
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
